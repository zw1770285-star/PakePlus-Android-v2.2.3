<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>刘幼娜 · 个人介绍</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: radial-gradient(circle at top, #0f2027, #203a43, #000000);
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
      width: 360px;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card:hover {
      transform: translateY(-12px) scale(1.02);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 36px;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(255,215,0,0.6);
    }

    h1 { font-size: 24px; margin-bottom: 10px; }

    .tag {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #ffd700;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .info { text-align: left; margin-top: 20px; }
    .info p { margin: 10px 0; line-height: 1.6; }
    .label { font-weight: 600; color: #bbb; }

    .footer { margin-top: 30px; font-size: 12px; color: #777; }

    .mood {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 0, 0, 0.1);
      color: #ff6b6b;
      font-size: 13px;
    }
  </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div class="card">
  <div class="avatar">刘</div>
  <h1>刘幼娜</h1>
  <div class="tag">IT 行业从业者</div>

  <div class="info">
    <p><span class="label">职业：</span>IT行业</p>
    <p><span class="label">爱好：</span>旅游 ✈️</p>
    <p><span class="label">性格：</span>有点小脾气，但很真实</p>
  </div>

  <div class="mood">⚡ 偶尔会发脾气，但来得快去得也快</div>
  <div class="footer">© 2026 Personal Page</div>
</div>

<script>
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];
let meteors = [];

function createStar() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2,
    alpha: Math.random(),
    speed: Math.random() * 0.02
  };
}

for (let i = 0; i < 150; i++) stars.push(createStar());

function drawStars() {
  stars.forEach(star => {
    star.alpha += star.speed;
    if (star.alpha <= 0 || star.alpha >= 1) star.speed *= -1;

    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,215,0,${star.alpha})`;
    ctx.fill();
  });
}

function createMeteor() {
  return {
    x: Math.random() * canvas.width,
    y: 0,
    len: Math.random() * 80 + 50,
    speed: Math.random() * 6 + 4,
    angle: Math.PI / 4
  };
}

function drawMeteors() {
  if (Math.random() < 0.02) meteors.push(createMeteor());

  meteors.forEach((m, i) => {
    const x = m.x;
    const y = m.y;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - m.len * Math.cos(m.angle), y - m.len * Math.sin(m.angle));
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();

    m.x += m.speed;
    m.y += m.speed;

    if (m.y > canvas.height) meteors.splice(i, 1);
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStars();
  drawMeteors();
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('mousemove', (e) => {
  stars.push({
    x: e.clientX,
    y: e.clientY,
    size: 2,
    alpha: 1,
    speed: -0.02
  });
});

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

  <audio id="bgMusic" src="video_20260415_170321.mp3" loop autoplay muted></audio>

  <script>
    // 点击页面后开启声音（浏览器限制自动播放声音）
    const music = document.getElementById('bgMusic');
    document.addEventListener('click', () => {
      music.muted = false;
      music.play().catch(err => {
        console.log('音频播放失败:', err);
      });
    });
  </script>

</body>
</html>
