<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞行射击小游戏</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
#startBtn, #restartBtn{
  position:absolute;left:50%;transform:translateX(-50%);
  padding:12px 24px;font-size:18px;border:none;border-radius:10px;
}
#startBtn{ top:50%; }
#restartBtn{ top:60%; display:none; }
#rankBox{
  position:absolute; right:10px; top:10px;
  background:rgba(0,0,0,0.5); color:#fff; padding:10px;
  font-size:12px; border-radius:8px;
}
</style>
</head>
<body>
<button id="startBtn">开始游戏</button>
<button id="restartBtn">重新开始</button>
<div id="rankBox"></div>
<canvas id="game"></canvas>

<!-- 音频 -->
<audio id="bgMusic" src="video_20260415_175628.mp3" loop>
<audio id="dieSound" src="20260415_174931.m4a">
<audio id="bossDieSound" src="video_20260415_191417.mp3">

<script>
const canvas = document.getElementById('game');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const bgMusic = document.getElementById('bgMusic');
const dieSound = document.getElementById('dieSound');
const bossDieSound = document.getElementById('bossDieSound');

// 图片
const enemyImg = new Image();
enemyImg.src = "234.jpg";

const bossImg = new Image();
bossImg.src = "123.jpg";

let gameStarted = false;
let gameOver = false;

let player = { x:200, y:500, hp:100, maxHp:100 };
function initPlayer(){
  player = { x:200, y:500, hp:100, maxHp:100 };
}

let score = 0;
let highScore = Number(localStorage.getItem('highScore')||0);
let rankings = JSON.parse(localStorage.getItem('rankings')||'[]');

let bullets = [];
let enemyBullets = [];
let level = 1;

let enemies = [];
let boss = null;
let bossBullets = [];
let explosions = [];

function spawnEnemy(){
  if(!boss){
    enemies.push({x:Math.random()*canvas.width,y:-20,size:30,speed:2});
  }
}

function spawnBoss(){
  boss = {x:100,y:50,w:120,h:120,hp:200,maxHp:200,dir:1};
}

function shoot(){
  if(level===1){ bullets.push({x:player.x,y:player.y,speed:8}); }
  else if(level===2){
    bullets.push({x:player.x-10,y:player.y,speed:8});
    bullets.push({x:player.x+10,y:player.y,speed:8});
  }else{
    bullets.push({x:player.x,y:player.y,speed:10});
    bullets.push({x:player.x-15,y:player.y,speed:8});
    bullets.push({x:player.x+15,y:player.y,speed:8});
  }
}

function boom(x,y){
  for(let i=0;i<10;i++){
    explosions.push({x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:20});
  }
}

canvas.addEventListener('touchmove',e=>{
  let t=e.touches[0];player.x=t.clientX;player.y=t.clientY;
});
canvas.addEventListener('mousemove',e=>{
  player.x=e.clientX;player.y=e.clientY;
});

function update(){
  if(gameOver) return;

  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i];b.y-=b.speed;
    if(b.y<0) bullets.splice(i,1);
  }

  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i];e.y+=e.speed;

    if(Math.random()<0.004){
      enemyBullets.push({x:e.x,y:e.y,speed:2.5});
    }

    if(e.y>canvas.height){
      player.hp-=5;
      enemies.splice(i,1);
      continue;
    }

    if(Math.abs(e.x-player.x)<20 && Math.abs(e.y-player.y)<20){
      player.hp-=10;
      enemies.splice(i,1);
      boom(player.x,player.y);
    }
  }

  for(let i=enemyBullets.length-1;i>=0;i--){
    let b=enemyBullets[i];b.y+=b.speed;
    if(Math.abs(b.x-player.x)<15 && Math.abs(b.y-player.y)<15){
      player.hp-=5;
      enemyBullets.splice(i,1);
    }
    if(b.y>canvas.height) enemyBullets.splice(i,1);
  }

  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i];
    for(let j=enemies.length-1;j>=0;j--){
      let e=enemies[j];
      if(Math.abs(b.x-e.x)<20 && Math.abs(b.y-e.y)<20){
        boom(e.x,e.y);
        bullets.splice(i,1);
        enemies.splice(j,1);
        score++;
        if(score%10===0) level++;
        if(score%20===0 && !boss) spawnBoss();
        break;
      }
    }
  }

  if(boss){
    boss.x+=boss.dir*5;
    if(boss.x<0||boss.x+boss.w>canvas.width) boss.dir*=-1;

    if(Math.random()<0.03){
      bossBullets.push({x:boss.x+boss.w/2,y:boss.y+boss.h,speed:5});
    }

    for(let i=bossBullets.length-1;i>=0;i--){
      let b=bossBullets[i];b.y+=b.speed;
      if(Math.abs(b.x-player.x)<15 && Math.abs(b.y-player.y)<15){
        player.hp-=5;
        bossBullets.splice(i,1);
      }
      if(b.y>canvas.height) bossBullets.splice(i,1);
    }

    for(let i=bullets.length-1;i>=0;i--){
      let b=bullets[i];
      if(b.x>boss.x && b.x<boss.x+boss.w && b.y>boss.y && b.y<boss.y+boss.h){
        boss.hp--;
        bullets.splice(i,1);
        if(boss.hp<=0){
          boom(boss.x,boss.y);
          // BOSS死亡音效
          bossDieSound.currentTime = 0;
          bossDieSound.play().catch(err=>{});
          boss=null;
          score+=20;
        }
      }
    }
  }

  explosions.forEach((ex,i)=>{
    ex.x+=ex.vx;ex.y+=ex.vy;ex.life--;
    if(ex.life<=0) explosions.splice(i,1);
  });

  if(player.hp<=0) endGame();
}

function draw(){
  ctx.fillStyle='black';ctx.fillRect(0,0,canvas.width,canvas.height);

  // 玩家
  ctx.fillStyle='cyan';
  ctx.beginPath();
  ctx.moveTo(player.x,player.y-20);
  ctx.lineTo(player.x-15,player.y+20);
  ctx.lineTo(player.x+15,player.y+20);
  ctx.fill();

  ctx.fillStyle='yellow';
  bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,10));

  // 小怪图片
  enemies.forEach(e=>{
    ctx.drawImage(enemyImg, e.x, e.y, e.size, e.size);
  });

  ctx.fillStyle='orange';
  enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,4,8));

  // BOSS图片
  if(boss){
    ctx.drawImage(bossImg, boss.x, boss.y, boss.w, boss.h);

    ctx.fillStyle='red';ctx.fillRect(20,20,200,10);
    ctx.fillStyle='lime';ctx.fillRect(20,20,200*(boss.hp/boss.maxHp),10);
  }

  ctx.fillStyle='orange';
  bossBullets.forEach(b=>ctx.fillRect(b.x,b.y,5,10));

  ctx.fillStyle='orange';
  explosions.forEach(ex=>{
    ctx.beginPath();ctx.arc(ex.x,ex.y,3,0,Math.PI*2);ctx.fill();
  });

  ctx.fillStyle='white';
  ctx.fillText('分数:'+score,20,60);

  ctx.fillStyle='red';ctx.fillRect(20,80,200,10);
  ctx.fillStyle='lime';ctx.fillRect(20,80,200*(player.hp/player.maxHp),10);

  if(gameOver){
    ctx.font='30px Arial';
    ctx.fillText('游戏结束',canvas.width/2-60,canvas.height/2);
  }
}

function updateRank(){
  let box = document.getElementById('rankBox');
  let html = '🏆 最高分: '+highScore+'<br>排行榜:<br>';
  rankings.forEach((s,i)=>{
    html += (i+1)+'. '+s+'<br>';
  });
  box.innerHTML = html;
}

function endGame(){
  gameOver = true;
  restartBtn.style.display='block';
  
  bgMusic.pause();
  dieSound.currentTime = 0;
  dieSound.play().catch(err=>{});

  if(score > highScore){
    highScore = score;
    localStorage.setItem('highScore', highScore);
  }

  rankings.push(score);
  rankings.sort((a,b)=>b-a);
  rankings = rankings.slice(0,5);
  localStorage.setItem('rankings', JSON.stringify(rankings));
  updateRank();
}

function loop(){
  if(gameStarted){ update(); draw(); }
  requestAnimationFrame(loop);
}
loop();

startBtn.onclick=()=>{
  gameStarted=true;
  startBtn.style.display='none';
  initPlayer();
  setInterval(spawnEnemy,800);
  setInterval(shoot,300);
  updateRank();

  bgMusic.volume = 0.6;
  bgMusic.play().catch(err=>{});
};

restartBtn.onclick=()=>{
  location.reload();
};
</script>
</body>
</html>
